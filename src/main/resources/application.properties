spring.application.name=atelie-digital
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/atelie-digital}

integrations.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
integrations.keycloak.realm=${KEYCLOAK_REALM:atelie-digital}
integrations.keycloak.client-id=${KEYCLOAK_ROLES_CLIENT_ID:atelie-core}
integrations.keycloak.client-secret=${KEYCLOAK_ROLES_CLIENT_SECRET:dev-client-secret}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
integrations.rabbitmq.exchange=${AUDIT_RABBITMQ_EXCHANGE:atelie.audit}
