name: atelie

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-atelie}
      POSTGRES_USER: ${DATABASE_USERNAME:-atelie}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-atelie}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-atelie} -d ${DATABASE_NAME:-atelie}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Carrinhos (modulo cart). Sem expiracao das chaves: o AOF persiste os dados entre reinicios.
  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-placeholder}
      KEYCLOAK_ROLES_CLIENT_SECRET: ${KEYCLOAK_ROLES_CLIENT_SECRET:-dev-client-secret}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloack/realm-atelie-dev.json:/opt/keycloak/data/import/realm-atelie.json:ro
      - ./infra/keycloack/themes/atelie:/opt/keycloak/themes/atelie:ro
    depends_on:
      - mailpit

  # SMTP de desenvolvimento usado pelo realm (e-mails de cadastro/verificacao).
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data: