name: atelie

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-atelie}
      POSTGRES_USER: ${DATABASE_USERNAME:-atelie}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-atelie}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-atelie} -d ${DATABASE_NAME:-atelie}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret-placeholder}
      KEYCLOAK_ROLES_CLIENT_SECRET: ${KEYCLOAK_ROLES_CLIENT_SECRET:-dev-client-secret}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloack/realm-atelie-dev.json:/opt/keycloak/data/import/realm-atelie.json:ro
      - ./infra/keycloack/themes/atelie:/opt/keycloak/themes/atelie:ro
    depends_on:
      - mailpit

  # SMTP de desenvolvimento usado pelo realm (e-mails de cadastro/verificacao).
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: atelie-minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-storage-data:/data
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: atelie-minio-init
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    command: [ "mb", "--ignore-existing", "local/${MINIO_BUCKET:-catalogs}" ]
    restart: on-failure

volumes:
  postgres-data:
  minio-data:
  minio-storage-data: