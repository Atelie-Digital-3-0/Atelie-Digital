name: atelie-prod

# Producao: Keycloak em modo `start` com o realm de prod (SMTP real) e Postgres dedicados.
# Uso: docker compose -f compose.prod.yaml --env-file .env up -d
# Variaveis marcadas com :? sao obrigatorias - o compose aborta se estiverem vazias.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-atelie}
      POSTGRES_USER: ${DATABASE_USERNAME:?defina DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: [ "start", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?defina KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD}

      # Keycloak atras de um proxy reverso que termina o TLS (nginx, Caddy, Traefik...).
      KC_HOSTNAME: "${KEYCLOAK_HOSTNAME:?defina KEYCLOAK_HOSTNAME}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      # Placeholders ${...} do realm-atelie-prod.json (resolvidos na importacao do realm).
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?defina SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME:?defina SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?defina SMTP_PASSWORD}
      ATELIE_WEB_ORIGIN: ${ATELIE_WEB_ORIGIN:?defina ATELIE_WEB_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?defina GOOGLE_CLIENT_SECRET}
      KEYCLOAK_ROLES_CLIENT_SECRET: ${KEYCLOAK_ROLES_CLIENT_SECRET:?defina KEYCLOAK_ROLES_CLIENT_SECRET}
    ports:
      # Apenas no loopback: exponha ao publico via proxy reverso com HTTPS.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloack/realm-atelie-prod.json:/opt/keycloak/data/import/realm-atelie.json:ro
      - ./infra/keycloack/themes/atelie:/opt/keycloak/themes/atelie:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  postgres-data:
  keycloak-db-data:
